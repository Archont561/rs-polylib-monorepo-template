schema = 1
branch_prefix = "sandbox"
cargo_vendor = true

[budgets]
max_blob_mib = 95
max_transport_mib = 2048
max_repository_push_mib = 2048
max_restore_required_mib = 8192

[[bundle]]
name = "developer"
# The `default` environment carries every feature the other environments add
# (`js`, `py`, `lint`, `sandbox`), so it alone gives the sandbox the complete
# toolchain. Publishing it on its own keeps the transport well inside the
# budgets above and avoids storing the same toolchain once per environment.
environments = ["default"]
platforms = ["linux-64"]
