test_version: 1
name: crates/polylib metacrate importing wasm_bindgen fails
tags: [check, boundaries, rust, failing]

given:
  tree:
    crates:
      polylib:
        src:
          lib.rs: |
            use wasm_bindgen::prelude::*;
            pub fn leaked() {}
  config: |
    version: 1
    rules:
      - id: boundary-rust-metacrate-no-bindings
        kind: import_gate
        language: rust
        paths: "crates/polylib/src/**/*.rs"
        forbid: "^(pyo3|wasm_bindgen|js_sys|web_sys|polylib_py|polylib_wasm)"
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - { rule: boundary-rust-metacrate-no-bindings, level: error }
