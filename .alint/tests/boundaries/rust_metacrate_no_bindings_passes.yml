test_version: 1
name: crates/polylib metacrate re-exporting polylib_core passes
tags: [check, boundaries, rust, passing]

given:
  tree:
    crates:
      polylib:
        src:
          lib.rs: |
            pub use polylib_core::{normalize_slug, summarize_scores};
  config: |
    version: 1
    rules:
      - id: boundary-rust-metacrate-no-bindings
        kind: import_gate
        language: rust
        paths: "crates/polylib/src/**/*.rs"
        forbid: "^(pyo3|wasm_bindgen|js_sys|web_sys|polylib_py|polylib_wasm)"
        level: error

when: [check]

expect:
  - exit: success
    violations: []
