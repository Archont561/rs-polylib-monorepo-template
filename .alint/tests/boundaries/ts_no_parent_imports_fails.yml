test_version: 1
name: packages/polylib-ts parent relative import fails
tags: [check, boundaries, typescript, failing]

given:
  tree:
    packages:
      polylib-ts:
        src:
          index.ts: |
            import { bad } from "../other";
            export { bad };
  config: |
    version: 1
    rules:
      - id: boundary-ts-no-parent-traversals
        kind: import_gate
        language: js
        paths: "packages/polylib-ts/src/**/*.ts"
        forbid: "^\\.\\./"
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - { rule: boundary-ts-no-parent-traversals, level: error }
