test_version: 1
name: crates/polylib-core importing napi fails
tags: [check, boundaries, rust, failing]

given:
  tree:
    crates:
      polylib-core:
        src:
          lib.rs: |
            use napi_derive::napi;
            pub fn leaked() {}
  config: |
    version: 1
    rules:
      - id: boundary-rust-core-no-bindings
        kind: import_gate
        language: rust
        paths: "crates/polylib-core/src/**/*.rs"
        forbid: "^(pyo3|wasm_bindgen|js_sys|web_sys|napi|napi_derive|polylib_py|polylib_wasm|polylib_js)"
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - { rule: boundary-rust-core-no-bindings, level: error }
