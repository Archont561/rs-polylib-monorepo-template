test_version: 1
name: crate missing features directory fails layout check
tags: [check, layout, failing]

given:
  tree:
    crates:
      demo:
        Cargo.toml: "[package]\nname = \"demo\"\n"
        README.md: "# demo\n"
        src:
          lib.rs: "pub fn ok() {}\n"
  config: |
    version: 1
    rules:
      - id: require-rust-crate-layout
        kind: dir_contains
        select: "crates/*"
        require:
          - Cargo.toml
          - README.md
          - src
          - features
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - { rule: require-rust-crate-layout, level: error }
