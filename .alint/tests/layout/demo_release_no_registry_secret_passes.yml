test_version: 1
name: the demo release workflow needs no registry credential
tags: [check, release, demo, credentials, passing]

docs:
  title: a workflow that only touches GITHUB_TOKEN is allowed
  case: pass
  kind: file_content_forbidden

given:
  tree:
    .github:
      workflows:
        release-demo.yml: |
          name: Release Demo
          on:
            workflow_dispatch:
          permissions:
            contents: read
          concurrency:
            group: release-demo-${{ github.ref }}
          jobs:
            publish-demo:
              name: Attach Dummy Packages
              runs-on: ubuntu-latest
              timeout-minutes: 10
              permissions:
                contents: write
              steps:
                - run: echo publishing
                  env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  config: |
    version: 1
    rules:
      - id: demo-release-needs-no-registry-secret
        kind: file_content_forbidden
        paths:
          - .github/workflows/release-demo.yml
        pattern: "CARGO_REGISTRY_TOKEN|PYPI_API_TOKEN|NPM_TOKEN|RUBYGEMS_API_KEY|MAVEN_CENTRAL"
        level: error

when: [check]

expect:
  - exit: success
    violations: []
