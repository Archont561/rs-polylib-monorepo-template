[tox]
requires =
    tox>=4
env_list =
    py{310,311,312,313,314}-core
    npm-compat
    rust-compat
package_root = packages/polylib-py
labels =
    python = py310-core, py311-core, py312-core, py313-core, py314-core
    npm = npm-pack, npm-bun, npm-node, npm-types, npm-compat
    rust = rust-features, rust-packages, rust-consumer, rust-compat
    ffi = kotlin-compat, ruby-compat, swift-compat
    compat = py312-core, npm-compat, rust-compat
    all = py312-core, npm-compat, rust-compat, kotlin-compat, ruby-compat, swift-compat

[testenv:.pkg]
pass_env =
    CARGO_*
    MATURIN_*
    PATH
    PYO3_*
    RUSTFLAGS
    RUSTUP_*

[testenv]
description = Verify Python package compatibility ({env_name})
package = wheel
pass_env =
    CARGO_*
    MATURIN_*
    PATH
    PYO3_*
    RUSTFLAGS
    RUSTUP_*
deps =
    pytest>=8,<10
    pytest-bdd>=8,<10
    hypothesis>=6,<7
commands =
    pytest {tox_root}/packages/polylib-py/tests
    python -c "import importlib.metadata as m, polylib; dist = m.distribution('polylib'); assert dist.metadata['Name'] == 'polylib' and dist.metadata['Requires-Python'] == '>=3.10'; assert not (dist.requires or list()); assert polylib.VERSION == polylib.__version__ and polylib.normalize_slug('Tox OK') == 'tox-ok'"

[testenv:py{310,311,312,313,314}-sdist]
description = Verify Python sdist build and compatibility ({env_name})
package = sdist

[testenv:npm-{compat,pack,bun,node,types}]
description = Verify npm/TypeScript package compatibility ({env_name})
skip_install = true
package = skip
deps =
set_env =
    PYTHONPATH = {tox_root}
pass_env =
    BUN_*
    HOME
    NODE_*
    NPM_*
    PATH
    USERPROFILE
allowlist_externals =
    bun
    node
    npm
commands =
    compat: {env_python} -B -m tools._lib.compat_ts --mode all
    pack: {env_python} -B -m tools._lib.compat_ts --mode pack
    bun: {env_python} -B -m tools._lib.compat_ts --mode bun
    node: {env_python} -B -m tools._lib.compat_ts --mode node
    types: {env_python} -B -m tools._lib.compat_ts --mode types

[testenv:rust-{compat,features,packages,consumer}]
description = Verify Rust Cargo compatibility ({env_name})
skip_install = true
package = skip
deps =
set_env =
    PYTHONPATH = {tox_root}
pass_env =
    CARGO_*
    HOME
    PATH
    RUSTFLAGS
    RUSTUP_*
    USERPROFILE
allowlist_externals =
    cargo
    rustc
commands =
    compat: {env_python} -B -m tools._lib.compat_rs --mode all
    features: {env_python} -B -m tools._lib.compat_rs --mode features
    packages: {env_python} -B -m tools._lib.compat_rs --mode packages
    consumer: {env_python} -B -m tools._lib.compat_rs --mode consumer

[testenv:{kotlin,ruby,swift}-compat]
description = Verify UniFFI package compatibility ({env_name})
skip_install = true
package = skip
deps =
set_env =
    PYTHONPATH = {tox_root}
pass_env =
    BUNDLE_*
    CC
    GEM_*
    GRADLE_*
    HOME
    JAVA_HOME
    PATH
    RUBY*
    SWIFT*
    USERPROFILE
allowlist_externals =
    bundle
    cc
    clang
    gcc
    gem
    gradle
    java
    javac
    ruby
    swift
commands =
    kotlin: {env_python} -B -m tools._lib.compat_ffi --target kotlin
    ruby: {env_python} -B -m tools._lib.compat_ffi --target ruby
    swift: {env_python} -B -m tools._lib.compat_ffi --target swift
