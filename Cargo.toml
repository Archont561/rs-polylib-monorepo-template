[workspace]
resolver = "3"
members = [
  "crates/polylib",
  "crates/polylib-core",
  "crates/polylib-ffi",
  "crates/polylib-js",
  "crates/polylib-py",
  "crates/polylib-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Polylib Contributors"]
license = "MIT"
repository = "https://github.com/your-org/polyglot-lib-template"
publish = false

[workspace.dependencies]
polylib-core = { path = "crates/polylib-core", version = "=0.1.0", default-features = false }

napi = { version = "3.14.0", default-features = false, features = ["napi9"] }
napi-build = "2.6.0"
napi-derive = "3.6.10"
pyo3 = { version = "0.30.1", default-features = false, features = ["macros", "abi3-py310"] }
serde = { version = "1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = "1.0.149"
serde-wasm-bindgen = "0.6.5"
thiserror = "2.0.18"
uniffi = "0.29.5"
wasm-bindgen = "=0.2.130"

proptest = "1.12.0"
rstest = "0.28.0"
rstest-bdd = "=0.6.0"
rstest-bdd-macros = { version = "=0.6.0", features = ["strict-compile-time-validation"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
