[build-system]
requires = ["maturin>=1.16,<2.0"]
build-backend = "maturin"

[project]
name = "polylib"
version = "0.1.0"
description = "Python bindings for polylib-core built with PyO3 and maturin."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Polylib Contributors" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/your-org/polyglot-lib-template"
Repository = "https://github.com/your-org/polyglot-lib-template"
Issues = "https://github.com/your-org/polyglot-lib-template/issues"

[tool.maturin]
manifest-path = "../../crates/polylib-py/Cargo.toml"
python-source = "src"
module-name = "polylib._native"
bindings = "pyo3"
features = ["extension-module"]
strip = true
exclude = ["**/__pycache__/**", "**/*.pyc"]
