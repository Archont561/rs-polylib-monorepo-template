# cargo-deny 0.20+ supply-chain policy

[graph]
all-features = false
no-default-features = false
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "wasm32-unknown-unknown",
]

[output]
feature-depth = 1

[advisories]
version = 2
yanked = "deny"
# RUSTSEC-2026-0374: `basic-toml` is unmaintained (informational, not a
# vulnerability) and has no patched release. It is pulled in transitively by
# `uniffi_bindgen` -> `askama` -> `askama_derive`, which is a build-time only
# dependency of the UniFFI code generator and is never linked into the
# published `polylib-core` library or any of its bindings.
ignore = [
  { id = "RUSTSEC-2026-0374", reason = "basic-toml is an unmaintained build-time-only transitive dependency of uniffi_bindgen; no patched release exists" },
]

[licenses]
version = 2
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = [{ crate = "openssl-sys", reason = "Use pure-Rust TLS (rustls) rather than system OpenSSL" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
