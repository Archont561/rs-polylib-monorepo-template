# Vale technical writing prose linter configuration (English).
# Uses the official Microsoft Writing Style Guide preset, vendored under
# `.vale/styles/Microsoft/` for offline execution (refresh with `vale sync`).

StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = Microsoft
Vocab = Polylib

[*.{md,mdx}]
BasedOnStyles = Vale, Microsoft
Vale.Spelling = NO
