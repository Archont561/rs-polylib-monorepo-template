# Vale technical writing prose linter configuration (English).
#
# Three layers, all vendored under `.vale/styles/` for offline execution:
#   Vale      — the built-in spelling and repetition checks.
#   Microsoft — the official Microsoft Writing Style Guide preset (47 rules).
#   alex      — the official alex inclusive-language package (11 rules, MIT).
#   Polyglot  — house rules for this repository's own conventions.
#
# Refresh the upstream presets with `vale sync` (see `Packages` below).

StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = Microsoft, alex
Vocab = Polylib

[*.{md,mdx}]
BasedOnStyles = Vale, Microsoft, alex, Polyglot

# The house spelling engine is out of scope: the vocabulary already covers the
# product names, and a general dictionary would drown the real findings.
# Microsoft's own spelling rule still applies.
Vale.Spelling = NO
