name: "Diagnose"
description: "Run a command and echo its output as a GitHub annotation and step summary when it fails."

inputs:
  label:
    description: "Short label describing the command under test."
    required: true
  command:
    description: "Command to execute."
    required: true
  tail-lines:
    description: "How many trailing lines of output to surface."
    required: false
    default: "40"

runs:
  using: "composite"
  steps:
    - name: Run command and report failures as annotations
      shell: bash
      env:
        DIAG_LABEL: ${{ inputs.label }}
        DIAG_COMMAND: ${{ inputs.command }}
        DIAG_TAIL: ${{ inputs.tail-lines }}
      run: |
        set +e
        log="$(mktemp)"
        bash -c "$DIAG_COMMAND" >"$log" 2>&1
        status=$?
        cat "$log"
        if [ "$status" -ne 0 ]; then
          {
            echo "### $DIAG_LABEL failed"
            echo ""
            echo '```'
            cat "$log"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          # GitHub parses each workflow annotation from a single line and keeps
          # only a handful per step. Emit the lines that name the problem and
          # the lines that immediately follow them, because a parser error
          # usually spells out the reason on the next line.
          {
            grep -n -A 4 -i -E '(^|[^a-z])(error|failed|denied|not allowed|unlicensed|fatal)' "$log" \
              || head -n 12 "$log"
            echo '--- context ---'
            head -n 12 "$log"
          } \
            | tr '\r' '\n' \
            | grep -v '^$' \
            | head -n 8 \
            | sed -e 's/%/%25/g' -e 's/:/%3A/g' -e 's/,/%2C/g' \
            | while IFS= read -r line; do
                echo "::error title=${DIAG_LABEL} failed::${line}"
              done
        fi
        rm -f "$log"
        exit "$status"
