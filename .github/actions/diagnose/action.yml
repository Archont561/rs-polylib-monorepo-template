name: "Diagnose"
description: "Run a command and echo its output as a GitHub annotation and step summary when it fails."

inputs:
  label:
    description: "Short label describing the command under test."
    required: true
  command:
    description: "Command to execute."
    required: true
  tail-lines:
    description: "How many trailing lines of output to surface."
    required: false
    default: "40"

runs:
  using: "composite"
  steps:
    - name: Run command and report failures as annotations
      shell: bash
      env:
        DIAG_LABEL: ${{ inputs.label }}
        DIAG_COMMAND: ${{ inputs.command }}
        DIAG_TAIL: ${{ inputs.tail-lines }}
      run: |
        set +e
        log="$(mktemp)"
        bash -c "$DIAG_COMMAND" >"$log" 2>&1
        status=$?
        cat "$log"
        if [ "$status" -ne 0 ]; then
          {
            echo "### $DIAG_LABEL failed"
            echo ""
            echo '```'
            cat "$log"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          # GitHub keeps only a handful of annotations per step, so the tail is
          # packed into a single multi-line annotation (newlines are encoded as
          # %0A) instead of being emitted one annotation per line.
          tail -n "$DIAG_TAIL" "$log" \
            | tr '\r' '\n' \
            | sed -e 's/%/%25/g' -e 's/:/%3A/g' -e 's/,/%2C/g' \
            | sed -e '$!s/$/%0A/' \
            | tr -d '\n' \
            > "$log.tail"
          echo "::error title=${DIAG_LABEL} failed::$(cat "$log.tail")"
          rm -f "$log.tail"
        fi
        rm -f "$log"
        exit "$status"
