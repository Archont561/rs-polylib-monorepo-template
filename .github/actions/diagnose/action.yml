name: "Diagnose"
description: "Run a command and echo its output as a GitHub annotation and step summary when it fails."

inputs:
  label:
    description: "Short label describing the command under test."
    required: true
  command:
    description: "Command to execute."
    required: true
  tail-lines:
    description: "How many trailing lines of output to surface."
    required: false
    default: "40"

runs:
  using: "composite"
  steps:
    - name: Run command and report failures as annotations
      shell: bash
      env:
        DIAG_LABEL: ${{ inputs.label }}
        DIAG_COMMAND: ${{ inputs.command }}
        DIAG_TAIL: ${{ inputs.tail-lines }}
      run: |
        set +e
        log="$(mktemp)"
        bash -c "$DIAG_COMMAND" >"$log" 2>&1
        status=$?
        cat "$log"
        if [ "$status" -ne 0 ]; then
          {
            echo "### $DIAG_LABEL failed"
            echo ""
            echo '```'
            cat "$log"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          # GitHub keeps only a handful of annotations per step, so fold the whole
          # log into a single one and prefer the head of the output: the reason a
          # tool failed is usually in its first lines, not its last.
          {
            echo "::error title=${DIAG_LABEL} failed::"
            echo "--- head ---"
            head -n 15 "$log"
            echo "--- tail ---"
            tail -n 10 "$log"
          } | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | while IFS= read -r line; do
            echo "$line"
          done
        fi
        rm -f "$log"
        exit "$status"
