name: "Setup Full Polyglot Environment & Build Bindings"
description: "Install locked Pixi full environment, Bun deps, Cargo cache, and compile PyO3 + WASM + NAPI-RS bindings."

inputs:
  cache-key:
    description: "Shared key prefix for Swatinem/rust-cache."
    required: false
    default: "polyglot-bindings"
  napi-target:
    description: "Compile only this Rust target for the NAPI-RS addon, instead of the host's default."
    required: false
    default: ""
  rustup-toolchain:
    description: "Install the target's std with rustup, for targets the Pixi Rust cannot build."
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Setup Rust + Python + Bun full environment
      uses: ./.github/actions/setup-rust
      with:
        environment: full
        install-bun: "true"
        cache-key: ${{ inputs.cache-key }}

    - name: Build PyO3, wasm-bindgen, and NAPI-RS artifacts
      if: inputs.napi-target == ''
      shell: bash
      run: pixi run -e full tools run bindings build

    # A per-platform runner compiles exactly one target. `bindings build` compiles
    # the whole set, which is what the shared job wants and what this one must
    # not do: it would build eight targets that cannot run on this host.
    - name: Compile the NAPI-RS addon for one target
      if: inputs.napi-target != '' && inputs.rustup-toolchain != 'true'
      shell: bash
      env:
        NAPI_TARGET: ${{ inputs.napi-target }}
      run: |
        pixi run -e full cargo build --release --target "$NAPI_TARGET" -p polylib-js --locked
        pixi run -e full tools run bindings build --target ts

    # Two targets cannot use the Pixi Rust: conda-forge publishes no `rust-std`
    # for musl or for Windows on arm64, so the locked toolchain only ever has
    # the host's own std and `cargo build --target` fails. Those get a rustup
    # toolchain instead, at the version pinned in `pixi.toml` so it cannot drift
    # from the compiler the lockfile was resolved against.
    - name: Read the pinned Rust toolchain
      if: inputs.rustup-toolchain == 'true'
      id: rust-pin
      shell: bash
      run: |
        set -euo pipefail
        toolchain=$(sed -n 's/^rust = "=\(.*\)"$/\1/p' pixi.toml)
        [ -n "$toolchain" ] || { echo "No rust pin in pixi.toml"; exit 1; }
        echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
        echo "Pinned Rust toolchain: $toolchain"

    - name: Install the pinned toolchain and the target's std
      if: inputs.rustup-toolchain == 'true'
      uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
      with:
        toolchain: ${{ steps.rust-pin.outputs.toolchain }}
        targets: ${{ inputs.napi-target }}

    # A musl target links musl's C library statically by default, and a static
    # C library cannot go into a shared object at all: cargo rejects the build
    # outright rather than producing something unloadable. `musl-tools` supplies
    # a linking driver and the dynamic musl that `-crt-static` off needs. The
    # runner's architecture already matches its target, so this is a normal
    # build against a different C library, not a cross-architecture one.
    - name: Install the musl linker
      if: inputs.rustup-toolchain == 'true' && contains(inputs.napi-target, 'musl')
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends musl-tools
        musl-gcc --version

    - name: Compile the NAPI-RS addon with a rustup toolchain
      if: inputs.napi-target != '' && inputs.rustup-toolchain == 'true'
      shell: bash
      env:
        NAPI_TARGET: ${{ inputs.napi-target }}
      run: |
        set -euo pipefail
        if printf '%s' "$NAPI_TARGET" | grep -q musl; then
          # `-crt-static` has to be in `RUSTFLAGS` rather than a command-line
          # flag: cargo asks rustc which crate types the target supports before
          # building, and only the environment variable reaches that probe.
          export RUSTFLAGS="${RUSTFLAGS:-} -C target-feature=-crt-static"
          upper=$(printf '%s' "$NAPI_TARGET" | tr 'a-z-' 'A-Z_')
          export "CARGO_TARGET_${upper}_LINKER=musl-gcc"
        fi
        # Prove the toolchain before compiling, so a missing target names itself
        # instead of surfacing as an opaque cargo exit code later.
        cargo --version
        rustc --version
        rustup target list --installed | grep -qx "$NAPI_TARGET" \
          || { echo "rustup has no std installed for $NAPI_TARGET"; exit 1; }
        # A failing cargo reports the reason on its last lines, and this job's
        # log is only readable from outside the workflow. Promote them to
        # annotations, which the checks API reports as soon as the step fails.
        # `PIPESTATUS` is what makes the exit status survive the `tee`, and the
        # status alone separates a linker error from a process that was killed.
        set +e
        cargo build --release --target "$NAPI_TARGET" -p polylib-js --locked 2>&1 | tee cargo.log
        status=${PIPESTATUS[0]}
        set -e
        if [ "$status" -ne 0 ]; then
          echo "cargo build exited with status $status"
          # Colour codes make an annotation unreadable, and the checks API
          # keeps only the first ten per step, so send just the lines that name
          # the failure rather than a window that might miss them.
          strip=$(sed -E 's/\x1b\[[0-9;]*[a-zA-Z]//g' cargo.log)
          errors=$(printf '%s\n' "$strip" | grep -E '^(error|warning: unused|  = note)' | tail -n 6)
          annotations=${errors:-$(printf '%s\n' "$strip" | tail -n 6)}
          printf '%s\n' "$annotations" | while IFS= read -r line; do echo "::error::$line"; done
          exit "$status"
        fi
        pixi run -e full tools run bindings build --target ts
