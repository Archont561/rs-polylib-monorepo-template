name: "Setup Full Polyglot Environment & Build Bindings"
description: "Install locked Pixi full environment, Bun deps, Cargo cache, and compile PyO3 + WASM + NAPI-RS bindings."

inputs:
  cache-key:
    description: "Shared key prefix for Swatinem/rust-cache."
    required: false
    default: "polyglot-bindings"
  napi-target:
    description: "Compile only this Rust target for the NAPI-RS addon, instead of the host's default."
    required: false
    default: ""
  container:
    description: "Alpine image the matrix builds a musl target inside, or empty."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    # A container job runs on Alpine, where the glibc pixi binary that
    # `setup-pixi` installs cannot execute, so only the host path sets it up.
    - name: Setup Rust + Python + Bun full environment
      if: inputs.container == ''
      uses: ./.github/actions/setup-rust
      with:
        environment: full
        install-bun: "true"
        cache-key: ${{ inputs.cache-key }}

    # The container has no pixi, so every tool the build and the staging task
    # need is installed here instead: a Rust toolchain at the workspace's
    # `rust-version`, Node.js and npm for `bun pm pack`'s job, and the task
    # runner itself. `GITHUB_PATH` only affects later steps, which is why the
    # compile is its own step.
    - name: Install the musl toolchain
      if: inputs.container != ''
      shell: sh
      env:
        NAPI_TARGET: ${{ inputs.napi-target }}
      run: |
        set -eux
        apk add --no-cache musl-dev perl make gcc g++ curl git nodejs npm python3 py3-pip
        # `--default-toolchain 1.88` installs only the host target; a
        # `cargo build --target` needs that target's std as well, and cargo
        # otherwise exits 101 with a "may not be installed" note.
        curl -fsSL https://sh.rustup.rs \
          | sh -s -- -y --profile minimal --default-toolchain 1.88 --target "$NAPI_TARGET"
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        pip3 install --break-system-packages --quiet tasknest==0.4.0 jinja2
        python3 -c "import tasknest"

    - name: Build PyO3, wasm-bindgen, and NAPI-RS artifacts
      if: inputs.napi-target == '' && inputs.container == ''
      shell: bash
      run: pixi run -e full tools run bindings build

    # A per-platform runner compiles exactly one target. `bindings build` compiles
    # the whole set, which is what the shared job wants and what this one must
    # not do: it would build seven targets that cannot run on this host.
    - name: Compile the NAPI-RS addon for one target
      if: inputs.napi-target != '' && inputs.container == ''
      shell: bash
      env:
        NAPI_TARGET: ${{ inputs.napi-target }}
      run: |
        pixi run -e full cargo build --release --target "$NAPI_TARGET" -p polylib-js --locked
        pixi run -e full tools run bindings build --target ts

    # Inside the musl container there is no pixi, so the compile runs against the
    # rustup toolchain installed above. `napi build` is not needed: `stage_napi`
    # reads the cdylib cargo produces and gives it the napi name itself.
    - name: Compile the NAPI-RS addon inside the musl container
      if: inputs.napi-target != '' && inputs.container != ''
      shell: sh
      env:
        NAPI_TARGET: ${{ inputs.napi-target }}
      run: |
        set -eux
        cargo build --release --target "$NAPI_TARGET" -p polylib-js --locked
