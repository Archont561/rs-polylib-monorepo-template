name: Build

# The build produces release artifacts (report.json, report.md, SHA256SUMS.txt)
# and the packaged bundles that `publish.yml` releases. It therefore runs on main
# and on a release tag, not on every pull request: `ci.yml` already proves the
# commit compiles, and the artifacts have no consumer on a pull request.
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build-rust:
    name: Build & Pack Rust Crates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust environment & cache
        uses: ./.github/actions/setup-rust
        with:
          environment: rust
          cache-key: build-rust

      - name: Verify Rust lint, tests, policy, and compatibility
        run: |
          pixi run -e rust tools run rust lint
          pixi run -e rust tools run rust test
          pixi run -e rust tools run security deny_rs
          pixi run -e rust tools run rust compat

      - name: Check Rust SemVer API compatibility
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        continue-on-error: true
        with:
          package: polylib

      - name: Pack Rust .crate archives
        run: pixi run -e rust tools run release pack --target rust --output-dir dist-artifacts

      - name: Upload Rust crate artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-rust
          path: dist-artifacts/rust/*.crate
          if-no-files-found: error

  build-python-wheels:
    name: Build Python Wheels (${{ matrix.os }} / ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            args: "--release --locked --compatibility manylinux2014"
          - os: macos-15
            target: aarch64
            args: "--release --locked"
          - os: windows-latest
            target: x64
            args: "--release --locked"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build cp310-abi3 wheels via maturin-action
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: packages/polylib-py
          target: ${{ matrix.target }}
          args: ${{ matrix.args }} --out dist-wheels
          manylinux: auto

      - name: Upload Python wheel artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-python-wheels-${{ matrix.os }}-${{ matrix.target }}
          path: packages/polylib-py/dist-wheels/*.whl
          if-no-files-found: error

  build-python-sdist:
    name: Build Python Source Distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build sdist via maturin-action
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          working-directory: packages/polylib-py
          args: --out dist-sdist

      - name: Upload Python sdist artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-python-sdist
          path: packages/polylib-py/dist-sdist/*.tar.gz
          if-no-files-found: error

  build-npm:
    name: Build & Pack npm Packages (WASM, NAPI-RS, Facade)
    needs: [build-napi-platforms]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup full environment & compile bindings
        uses: ./.github/actions/setup-bindings
        with:
          cache-key: build-npm

      - name: Run Python and TypeScript test & compatibility gates
        run: |
          pixi run -e full tools run python test
          pixi run -e full tools run python compat
          pixi run -e full tools run ts lint
          pixi run -e full tools run ts test
          pixi run -e full tools run ts compat

      - name: Download the compiled per-platform packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: napi-*
          path: dist-artifacts/napi
          merge-multiple: true

      - name: Stage each platform package beside the addon package
        shell: bash
        run: |
          # `release pack` reads `packages/polylib-js/npm/<suffix>/`, so the
          # downloaded tarballs are unpacked back into that layout. The main
          # tarball's optionalDependencies name these packages, and a release
          # that lists eight but publishes five is a broken install.
          mkdir -p packages/polylib-js/npm
          for tarball in dist-artifacts/napi/*.tgz; do
            [ -e "$tarball" ] || { echo "No platform tarballs were downloaded."; exit 1; }
            # Every per-platform package is named `@polylib/polylib-js-<suffix>`,
            # so the published name is what says which directory this belongs
            # in. `--one-top-level` names it after the tarball instead, so the
            # layout `release pack` reads would never appear.
            suffix=$(tar xzOf "$tarball" package/package.json \
              | python3 -c 'import json,sys;print(json.load(sys.stdin)["name"].removeprefix("@polylib/polylib-js-"))')
            echo "unpacking $(basename "$tarball") as $suffix"
            rm -rf "packages/polylib-js/npm/$suffix"
            mkdir -p "packages/polylib-js/npm/$suffix"
            tar xzf "$tarball" -C "packages/polylib-js/npm/$suffix" --strip-components=1
          done
          # `napi.targets` lists what the loader will try to require, and the
          # matrix builds every entry, so the two must match exactly: a release
          # that lists a package it did not publish is a broken install.
          expected=$(python3 -c 'import json;print(len(json.load(open("packages/polylib-js/package.json"))["napi"]["targets"]))')
          actual=$(find packages/polylib-js/npm -name package.json | wc -l)
          echo "staged $actual of $expected platform packages"
          [ "$actual" -eq "$expected" ] || { echo "A platform package is missing."; exit 1; }

      - name: Pack npm tarballs
        run: |
          pixi run -e full tools run release pack --target npm --output-dir dist-artifacts
          # One tarball for the addon package and one per platform package. The
          # count above proves the downloaded set was complete; this proves the
          # pack actually emitted all of them, which is what gets published.
          packed=$(find dist-artifacts/npm -name '*.tgz' | wc -l)
          expected=$(( $(python3 -c 'import json;print(len(json.load(open("packages/polylib-js/package.json"))["napi"]["targets"]))') + 1 ))
          echo "packed $packed npm tarballs, expected $expected"
          [ "$packed" -eq "$expected" ] || { echo "The npm pack is missing a tarball."; exit 1; }

      - name: Upload npm tarball artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-npm
          path: dist-artifacts/npm/*.tgz
          if-no-files-found: error

  build-napi-platforms:
    name: Build NAPI addon (${{ matrix.suffix }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              suffix: linux-x64-gnu,
              runner: ubuntu-latest,
              cross-mode: "",
              target: x86_64-unknown-linux-gnu,
            }
          - {
              suffix: linux-arm64-gnu,
              runner: ubuntu-24.04-arm,
              cross-mode: "",
              target: aarch64-unknown-linux-gnu,
            }
          # A musl addon links musl's `libgcc_s` unwinder, and Ubuntu's
          # `musl-gcc` ships no musl build of it, so the compile runs in an
          # Alpine container where GCC is musl-native. That container is a
          # plain `docker run`, not a job-level `container:`, because GitHub
          # runs JavaScript Actions such as `actions/checkout` inside one only
          # on x64 runners — which is what made the arm64 target impossible
          # before. Each runner's own architecture matches its target.
          - {
              suffix: linux-x64-musl,
              runner: ubuntu-latest,
              cross-mode: "musl",
              target: x86_64-unknown-linux-musl,
            }
          - {
              suffix: linux-arm64-musl,
              runner: ubuntu-24.04-arm,
              cross-mode: "musl",
              target: aarch64-unknown-linux-musl,
            }
          - {
              suffix: darwin-x64,
              runner: macos-15-intel,
              cross-mode: "",
              target: x86_64-apple-darwin,
            }
          - { suffix: darwin-arm64, runner: macos-15, cross-mode: "", target: aarch64-apple-darwin }
          - {
              suffix: win32-x64-msvc,
              runner: windows-latest,
              cross-mode: "",
              target: x86_64-pc-windows-msvc,
            }
          # Pixi has no `win-arm64` platform, so its locked Rust is the x64
          # build and can never produce an arm64 addon. The x64 image ships the
          # ARM64 MSVC toolchain and MSVC cross-links its own architectures, so
          # this builds there with a rustup toolchain that has the arm64 std.
          # `windows-11-arm` cannot run Pixi at all, for the same missing
          # platform reason.
          - {
              suffix: win32-arm64-msvc,
              runner: windows-latest,
              cross-mode: "rustup",
              target: aarch64-pc-windows-msvc,
            }
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compile the addon for ${{ matrix.suffix }}
        uses: ./.github/actions/setup-bindings
        with:
          cache-key: build-napi-${{ matrix.suffix }}
          napi-target: ${{ matrix.target }}
          cross-mode: ${{ matrix.cross-mode }}

      # A failed compile is the one thing this workflow cannot show: the job log
      # is only reachable from inside GitHub. The compile leaves `cargo.log`
      # behind, and an artifact of it can be read from anywhere.
      - name: Upload the compile log when the build fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-log-${{ matrix.suffix }}
          path: cargo.log
          if-no-files-found: ignore

      # `stage_napi` assembles `packages/polylib-js/npm/<suffix>/`; a tarball is
      # what the upload and the `build-npm` job both consume, so this step packs
      # one too. `bun pm pack` is what `release pack` uses.
      - name: Stage and pack the per-platform package
        shell: bash
        run: |
          set -euo pipefail
          pixi run -e full tools run bindings stage_napi --suffix ${{ matrix.suffix }}
          mkdir -p "dist-artifacts/napi/${{ matrix.suffix }}"
          pixi run -e full bun pm pack \
            --cwd "packages/polylib-js/npm/${{ matrix.suffix }}" \
            --destination "$PWD/dist-artifacts/napi/${{ matrix.suffix }}"

      - name: Upload the per-platform package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: napi-${{ matrix.suffix }}
          path: dist-artifacts/napi/${{ matrix.suffix }}/*.tgz
          if-no-files-found: error

  build-uniffi-kotlin-ruby:
    name: Build & Pack UniFFI Kotlin JAR & Ruby Gem
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pixi ffi environment & Rust cache
        uses: ./.github/actions/setup-rust
        with:
          environment: ffi
          cache-key: build-uniffi-linux

      - name: Build, test, and verify Kotlin & Ruby UniFFI packages
        run: |
          pixi run -e ffi tools run ffi build
          pixi run -e ffi tools run ffi test --target kotlin
          pixi run -e ffi tools run ffi compat --target kotlin
          pixi run -e ffi tools run ffi test --target ruby
          pixi run -e ffi tools run ffi compat --target ruby

      - name: Pack Kotlin JAR/POM and Ruby gem
        run: |
          pixi run -e ffi tools run release pack --target kotlin --output-dir dist-artifacts
          pixi run -e ffi tools run release pack --target ruby --output-dir dist-artifacts

      - name: Upload Kotlin artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-kotlin
          path: dist-artifacts/kotlin/*
          if-no-files-found: error

      - name: Upload Ruby gem artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-ruby
          path: dist-artifacts/ruby/*.gem
          if-no-files-found: error

  build-uniffi-swift:
    name: Build & Pack UniFFI SwiftPM Bundle
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pixi rust environment & Rust cache
        uses: ./.github/actions/setup-rust
        with:
          environment: rust
          cache-key: build-uniffi-swift-macos

      - name: Build, test, and pack SwiftPM UniFFI bundle
        run: |
          pixi run -e rust tools run ffi build --target swift
          pixi run -e rust tools run ffi test --target swift --require-swift
          pixi run -e rust tools run ffi compat --target swift
          pixi run -e rust tools run release pack --target swift --output-dir dist-artifacts

      - name: Upload SwiftPM bundle artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-swift
          path: dist-artifacts/swift/*.tar.gz
          if-no-files-found: error

  build-report:
    name: Generate Build Report (report.json + report.md)
    needs:
      - build-rust
      - build-python-wheels
      - build-python-sdist
      - build-npm
      - build-uniffi-kotlin-ruby
      - build-uniffi-swift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pixi default environment
        uses: ./.github/actions/setup
        with:
          environment: default

      - name: Download all built ecosystem artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "artifacts-*"
          path: dist-release

      - name: Generate report.json, Jinja-rendered report.md, and SHA256SUMS.txt
        env:
          GIT_REF: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHECKS_SPEC: >-
            build-rust=${{ needs.build-rust.result }},
            build-python-wheels=${{ needs.build-python-wheels.result }},
            build-python-sdist=${{ needs.build-python-sdist.result }},
            build-npm=${{ needs.build-npm.result }},
            build-uniffi-kotlin-ruby=${{ needs.build-uniffi-kotlin-ruby.result }},
            build-uniffi-swift=${{ needs.build-uniffi-swift.result }}
        run: |
          pixi run tools run release report \
            --artifacts-dir dist-release \
            --output-dir dist-report \
            --checks "$CHECKS_SPEC"
          cp dist-report/report.json dist-report/report.md dist-report/SHA256SUMS.txt dist-release/
          cat dist-report/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build-report artifact (report.json, report.md, SHA256SUMS.txt)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-report
          path: |
            dist-report/report.json
            dist-report/report.md
            dist-report/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload unified release-bundle artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: dist-release/**
          if-no-files-found: error
