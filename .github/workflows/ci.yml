name: CI

# Every pull request starts this workflow so each job can report a status. The
# `changes` job then decides which matrices a change can actually reach, and the
# jobs it cannot reach are skipped. A workflow-level `paths` filter would be
# cheaper still, but it leaves the required checks pending rather than skipped,
# which blocks the merge it was meant to speed up.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GitHub applies `paths` to the workflow as a whole and offers no per-job
  # equivalent, so this job answers the question once and the matrices read the
  # answer. A job that is skipped this way still reports a status, which a
  # workflow-level filter does not: a required check must never sit pending.
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      python: ${{ steps.detect.outputs.python }}
      js: ${{ steps.detect.outputs.js }}
      jvm: ${{ steps.detect.outputs.jvm }}
      ruby: ${{ steps.detect.outputs.ruby }}
      swift: ${{ steps.detect.outputs.swift }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Compare the change against the filters
        id: detect
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # A manual dispatch asks for the whole suite, so every filter is
          # forced on rather than derived from whatever the last commit touched.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Whole-repository run: enabling every matrix."
            for key in rust python js jvm ruby swift; do
              echo "$key=true" >> "$GITHUB_OUTPUT"
            done
          else
            python3 .github/scripts/detect_changes.py --profile ci
          fi

  quality:
    name: Policy, Docs & Static Linters
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pixi full environment & Bun workspace
        uses: ./.github/actions/setup
        with:
          environment: full
          install-bun: "true"

      - name: Validate Tasknest graph & generated agent skill
        run: |
          pixi run -e full tools check
          pixi run -e full tools skill --check

      - name: Run offline policy, docs, formatting, and linter gates
        uses: ./.github/actions/diagnose
        with:
          label: "repository quality gates"
          command: pixi run -e full tools run check

  rust:
    name: Rust (Clippy, Tests, Deny, Compat)
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain & cache
        uses: ./.github/actions/setup-rust
        with:
          environment: rust
          cache-key: ci-rust

      - name: Lint Rust workspace
        run: pixi run -e rust tools run rust lint

      - name: Test Rust workspace with coverage
        run: pixi run -e rust tools run rust test --coverage

      - name: Check Cargo policy (cargo-deny offline)
        run: pixi run -e rust tools run security deny_rs

      - name: Verify Rust feature matrix, tarballs, and isolated .crate consumer
        run: pixi run -e rust tools run rust compat

      - name: Upload Rust coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-rust
          path: coverage/rust/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/rust/lcov.info
          flags: rust
          name: coverage-rust
          fail_ci_if_error: false

  rust-msrv:
    name: Rust MSRV Proof
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pixi default environment
        uses: ./.github/actions/setup
        with:
          environment: default

      - name: Read declared MSRV from Cargo.toml
        id: msrv
        run: pixi run tools run rust msrv --github-output msrv

      - name: Install declared MSRV Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ steps.msrv.outputs.msrv }}

      - name: Cache Cargo registry for MSRV
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-rust-msrv-${{ steps.msrv.outputs.msrv }}
          cache-on-failure: true

      - name: Prove metacrate feature matrix at declared MSRV
        run: pixi run tools run rust msrv --toolchain "${{ steps.msrv.outputs.msrv }}"

  polyglot-bindings:
    name: Python & TypeScript Bindings + Compat
    needs: [changes]
    if: >-
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup full environment & compile PyO3 + WASM bindings
        uses: ./.github/actions/setup-bindings
        with:
          cache-key: ci-bindings

      # The runtime matrices below install the per-platform package by name. On a
      # push `build.yml` produces that artifact; a pull request never runs
      # `build.yml`, so without this the matrices download nothing and every
      # addon-dependent fixture is left with no package to install. This job has
      # already compiled the host addon, so it stages and publishes exactly the
      # package that host would install, under the name the matrices look for.
      - name: Stage the host addon package for the runtime matrices
        shell: bash
        run: |
          set -euo pipefail
          # Resolved through the pixi environment like every other task call: the
          # system interpreter has neither `tasknest` nor this package on its path.
          suffix=$(pixi run -e full python -c \
            "from tools._lib.napi_platforms import host_suffix; print(host_suffix())")
          echo "NAPI_SUFFIX=$suffix" >> "$GITHUB_ENV"
          pixi run -e full tools run bindings stage_napi --suffix "$suffix"
          mkdir -p "$GITHUB_WORKSPACE/dist-artifacts/napi/$suffix"
          pixi run -e full bun pm pack \
            --cwd "packages/polylib-js/npm/$suffix" \
            --destination "$GITHUB_WORKSPACE/dist-artifacts/napi/$suffix"

      - name: Upload the host addon package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: napi-${{ env.NAPI_SUFFIX }}
          path: dist-artifacts/napi/${{ env.NAPI_SUFFIX }}/*.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Run Python tests with coverage
        run: pixi run -e full tools run python test --coverage

      - name: Run TypeScript typecheck & tests with coverage
        run: |
          pixi run -e full tools run ts lint
          pixi run -e full tools run ts test --coverage

      - name: Verify Python wheel/sdist & isolated venv compatibility
        run: pixi run -e full tools run python compat

      - name: Verify TypeScript tarball (publint, attw, isolated consumer)
        run: pixi run -e full tools run ts compat

      - name: Pack TypeScript tarballs for runtime compatibility matrices
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist-artifacts"
          # `bun pm pack --cwd <pkg>` resolves a relative `--destination` against the
          # package directory, not the repository root. Pass an absolute path so the
          # tarballs land where the upload step and the consumer matrices look for them.
          for pkg in polylib-wasm polylib-js polylib-ts; do
            pixi run -e full bun pm pack \
              --cwd "packages/$pkg" \
              --destination "$GITHUB_WORKSPACE/dist-artifacts"
          done
          ls -l "$GITHUB_WORKSPACE/dist-artifacts"

      - name: Upload packed TypeScript tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: polylib-ts-tarballs
          path: dist-artifacts/*.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Upload Python coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python
          path: coverage/python/
          if-no-files-found: error
          retention-days: 7

      - name: Upload TypeScript coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-ts
          path: coverage/ts/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/python/lcov.info
          flags: python
          name: coverage-python
          fail_ci_if_error: false

      - name: Upload TypeScript coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/ts/lcov.info
          flags: ts
          name: coverage-ts
          fail_ci_if_error: false

  python-versions:
    name: Python Compatibility (tox ${{ matrix.tox }})
    # The version matrices prove the compatibility promise on every pull request.
    # A push to main repeats the same code against the same matrices, so the
    # main push runs the single-job checks only. A change that cannot reach the
    # Python bindings skips the matrix instead of re-proving the same result.
    needs: [changes]
    if: github.event_name != 'push' && needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.10", tox: py310 }
          - { python: "3.11", tox: py311 }
          - { python: "3.12", tox: py312 }
          - { python: "3.13", tox: py313 }
          - { python: "3.14", tox: py314 }
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-py-matrix-${{ matrix.python }}

      - name: Install tox and run Python compatibility environment
        env:
          TOX_ENV: ${{ matrix.tox }}-core
        run: |
          python -m pip install --upgrade pip "tox>=4,<5"
          tox -e "$TOX_ENV"

  node-versions:
    name: Node.js Compatibility (${{ matrix.os }} / Node ${{ matrix.node-version }})
    needs: [changes, polyglot-bindings]
    if: github.event_name != 'push' && needs.changes.outputs.js == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # The full case set runs on Ubuntu; one Node version per case set keeps
          # the matrix bounded while still covering 20, 22, and 24.
          - { os: ubuntu-latest, node-version: "20", cases: all }
          - { os: ubuntu-latest, node-version: "22", cases: all }
          - { os: ubuntu-latest, node-version: "24", cases: all }
          # `server-only` and `cjs-require` are the two cases that can differ per
          # platform: one loads a compiled addon, the other requires it through
          # CommonJS. A musl host and an arm64 Windows host each exercise a
          # different platform package.
          - { os: ubuntu-24.04-arm, node-version: "22", cases: native }
          - { os: macos-15, node-version: "22", cases: native }
          - { os: windows-latest, node-version: "22", cases: native }
          # `windows-11-arm` is deliberately absent. It needs an addon compiled
          # for win32-arm64, which only `build.yml` produces, and its own build of
          # one has not succeeded. `windows-latest` covers the Windows loader and
          # the arm64 Linux entry covers the non-x64 package layout, so dropping it
          # costs no coverage that another entry does not already provide.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      # The fixture runner is a pixi task, and this job needs the Node.js that
      # `setup-node` just installed rather than a second one from the pixi
      # environment, so only Pixi is set up here. The fixtures bring their own
      # dependencies, so the workspace install is skipped too.
      - name: Setup Pixi for the consumer harness
        uses: ./.github/actions/setup
        with:
          environment: full
          install-bun: "false"

      - name: Download packed TypeScript tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: polylib-ts-tarballs
          path: dist-artifacts

      # `polyglot-bindings` publishes the package for the host that ran it, which
      # is ubuntu-latest. This matrix also covers arm64 and macOS runners, whose
      # addon is a different binary and cannot be installed cross-platform, so
      # those entries build their own below.
      - name: Download the addon package for this host
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: napi-*
          path: dist-artifacts/napi
          merge-multiple: true

      - name: Build the addon package when this host's was not published
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          suffix=$(pixi run -e full python -c \
            "from tools._lib.napi_platforms import host_suffix; print(host_suffix())")
          # `merge-multiple` flattens every `napi-*` artifact into one directory,
          # so the tarball is directly under `dist-artifacts/napi`, not under a
          # per-suffix subdirectory.
          if ls dist-artifacts/napi/polylib-polylib-js-"$suffix"-*.tgz >/dev/null 2>&1; then
            echo "Using the published $suffix package."
            exit 0
          fi
          # The downloaded artifacts also carry the x64 package, because that is
          # the one `polyglot-bindings` publishes. Leaving it in place would let
          # the fixture runner install an addon this host cannot load, so the
          # directory is reduced to this host's package alone.
          # `find` resolves to Windows' own `find.exe` under Git Bash, which has
          # no `-delete`; `rm` with a shell glob does the same job portably.
          rm -f dist-artifacts/napi/polylib-polylib-js-*.tgz
          echo "No $suffix package published; compiling it for this runner."
          # `napi` is a workspace dependency, and this job skips the workspace
          # install because the fixtures bring their own. The build needs it, so
          # it is installed here rather than for the whole job.
          pixi run -e full bun install --frozen-lockfile
          # The package's own script runs `napi build --platform`, which targets
          # exactly the host that is running it. The `bindings build --target
          # napi` task would compile all eight targets instead, seven of which
          # cannot run here.
          pixi run -e full bun run --cwd packages/polylib-js build:native
          pixi run -e full tools run bindings stage_napi --suffix "$suffix"
          pixi run -e full bun pm pack \
            --cwd "packages/polylib-js/npm/$suffix" \
            --destination "$PWD/dist-artifacts/napi"

      - name: Install tarballs and run the consumer fixtures
        shell: bash
        run: |
          pixi run -e js tools run ts consumers --runner bun \
            --tarball-dir dist-artifacts \
            --platform-dir dist-artifacts/napi \
            --cases "${{ matrix.cases }}"

  node-musl:
    name: Node.js Compatibility (musl addon on glibc host)
    needs: [changes, polyglot-bindings]
    # This runs on every event, including a push to main. It used to exclude
    # `push`, on the theory that `build.yml` would have produced the addon by
    # then — but artifacts belong to the run that made them, and `download-artifact`
    # cannot read another run's without a `run-id`. The job therefore never had
    # an addon on any event, and reported success after skipping every step that
    # tested one.
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download packed TypeScript tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: polylib-ts-tarballs
          path: dist-artifacts

      # `setup-bindings` installs the same Pixi full environment and Bun
      # workspace the rest of the job needs, so there is no separate setup step.
      #
      # The addon is a musl ELF and this host is glibc, so `host_suffix()` would
      # hand the fixtures the glibc package. It has to be a musl one, and it has
      # to be built here: `build.yml` produces one, but its artifacts belong to
      # its own run. `setup-bindings` carries the same musl route the release
      # build uses, so this proves that route and then proves the result loads.
      - name: Compile the musl addon
        uses: ./.github/actions/setup-bindings
        with:
          cache-key: ci-node-musl
          napi-target: x86_64-unknown-linux-musl
          cross-mode: musl

      - name: Stage and pack the musl addon
        shell: bash
        run: |
          set -euo pipefail
          pixi run -e full tools run bindings stage_napi --suffix linux-x64-musl
          mkdir -p dist-artifacts/napi/linux-x64-musl
          pixi run -e full bun pm pack \
            --cwd packages/polylib-js/npm/linux-x64-musl \
            --destination "$PWD/dist-artifacts/napi/linux-x64-musl"

      # The loaded addon is a musl ELF, so the process that requires it must be a
      # musl binary. Alpine's Node is installed with apk into its own root, which
      # is enough to require the package without pinning a container image.
      - name: Install the Alpine Node.js that will load the musl addon
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/alpine"
          mkdir -p "$root"
          curl -fsSLo /tmp/alpine-minirootfs.tar.gz \
            "https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/alpine-minirootfs-3.20.3-x86_64.tar.gz"
          sudo tar xzf /tmp/alpine-minirootfs.tar.gz -C "$root"
          sudo cp /etc/resolv.conf "$root/etc/resolv.conf"
          sudo chroot "$root" /sbin/apk add --no-cache nodejs npm
          # The chroot was only a way to run `apk`. Exporting the directory
          # through `$GITHUB_PATH` is what puts this Node ahead of the pixi one
          # for every later step; `$GITHUB_ENV` is a host file the chroot cannot
          # reach, and a bare `export` would not survive into the next step.
          echo "$root/usr/bin" >> "$GITHUB_PATH"

      - name: Report which libc the addon is loaded by
        shell: bash
        run: |
          ldd --version | head -1 || true
          # Prove the Node this job will use is the musl one, not the host's.
          # A glibc-linked Node cannot load a musl addon at all, so if this is
          # the wrong binary the fixture step fails rather than proving anything.
          echo "node on PATH: $(command -v node)"
          node --version
          node -e 'const h=process.report.getReport().header; console.log("glibc runtime:", h.glibcVersionRuntime ?? "none (musl)")'


      - name: Run the native consumer fixtures against the musl addon
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # The chrooted Node is what `npm` and `node` resolve to now, so the
          # fixture installs and runs entirely inside the musl userland.
          command -v node
          node --version
          python3 -B -m tasknest run ts consumers \
            --tarball-dir dist-artifacts \
            --platform-dir dist-artifacts/napi \
            --cases native

  bun-versions:
    name: Bun Compatibility (Bun ${{ matrix.bun-version }})
    needs: [changes, polyglot-bindings]
    if: github.event_name != 'push' && needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        bun-version: ["1.1", "1.4", "latest"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun ${{ matrix.bun-version }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Setup Pixi for the consumer harness
        uses: ./.github/actions/setup-rust
        with:
          environment: full
          install-bun: "false"
          cache-key: ci-bun-${{ matrix.bun-version }}

      - name: Download packed TypeScript tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: polylib-ts-tarballs
          path: dist-artifacts

      - name: Download the addon package for this host
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: napi-linux-x64-gnu
          path: dist-artifacts/napi
          merge-multiple: true

      # The fixtures are installed with npm and then run under `--runner bun`;
      # the pixi `full` environment carries Bun but no Node.js, so npm has to
      # come from the runner. Without this the harness dies in `npm install`
      # before it reaches the Bun process this job exists to exercise.
      - name: Setup Node.js for the npm that installs the fixtures
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Bun is what runs the consumer process here, which is the point of this
      # job: the same fixtures `ts compat` uses, on each supported Bun version.
      - name: Run the consumer fixtures under Bun
        uses: ./.github/actions/diagnose
        with:
          label: "bun consumer matrix"
          command: |
            pixi run -e js tools run ts consumers --runner bun \
              --tarball-dir dist-artifacts \
              --platform-dir dist-artifacts/napi

  uniffi-kotlin-ruby:
    name: UniFFI Bindings (Kotlin JVM & Ruby)
    needs: [changes]
    if: >-
      needs.changes.outputs.jvm == 'true' ||
      needs.changes.outputs.ruby == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pixi ffi environment & Rust cache
        uses: ./.github/actions/setup-rust
        with:
          environment: ffi
          cache-key: ci-uniffi-linux

      - name: Build UniFFI bindings for Kotlin, Swift, and Ruby
        run: pixi run -e ffi tools run ffi build

      - name: Run Kotlin & Ruby unit + shared Gherkin conformance suites with coverage (>= 90%)
        run: |
          pixi run -e ffi tools run ffi test --target kotlin --coverage
          pixi run -e ffi tools run ffi test --target ruby --coverage

      - name: Upload Kotlin coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-kotlin
          path: coverage/kotlin/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Ruby coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-ruby
          path: coverage/ruby/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Kotlin coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/kotlin/jacoco.xml
          flags: kotlin
          name: coverage-kotlin
          fail_ci_if_error: false

      - name: Upload Ruby coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/ruby/lcov.info
          flags: ruby
          name: coverage-ruby
          fail_ci_if_error: false

      # Swift is verified by the dedicated `swift-versions` job on macOS and
      # Linux; this job covers the Kotlin and Ruby targets only.
      - name: Verify Kotlin JAR and Ruby isolated gem compatibility
        uses: ./.github/actions/diagnose
        with:
          # This job provisions Gradle and Ruby explicitly, so a skip here means
          # the environment is broken rather than the toolchain being optional.
          label: "ffi compat (kotlin, ruby)"
          command: |
            pixi run -e ffi tools run ffi compat --target kotlin --require-toolchain
            pixi run -e ffi tools run ffi compat --target ruby --require-toolchain

      - name: Stage Kotlin JAR + runtime classpath and Ruby gem for version matrices
        uses: ./.github/actions/diagnose
        with:
          label: "stage kotlin and ruby artifacts"
          command: |
            mkdir -p dist-kt dist-rb
            cp packages/polylib-kt/build/libs/polylib-*.jar dist-kt/
            IFS=: read -r -a cp_jars < packages/polylib-kt/build/runtime-classpath.txt
            for jar in "${cp_jars[@]}"; do
              if [ -f "$jar" ]; then
                cp "$jar" dist-kt/
              fi
            done
            pixi run -e ffi tools run release pack --target ruby --output-dir dist-rb

      - name: Upload Kotlin runtime bundle for JDK compatibility matrix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: polylib-kt-dist
          path: dist-kt/*.jar
          retention-days: 1

      - name: Upload Ruby gem for Ruby compatibility matrix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: polylib-rb-gem
          path: dist-rb/ruby/*.gem
          retention-days: 1

  java-versions:
    name: JVM / Kotlin Compatibility (JDK ${{ matrix.java-version }})
    needs: [changes, uniffi-kotlin-ruby]
    if: github.event_name != 'push' && needs.changes.outputs.jvm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java-version: ["17", "21", "25"]
    steps:
      - name: Setup JDK ${{ matrix.java-version }}
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - name: Download Kotlin JAR and runtime classpath
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: polylib-kt-dist
          path: dist-kt

      - name: Compile and run standalone JVM consumer without -Djna.library.path
        run: |
          mkdir -p /tmp/jvm-consumer
          cat > /tmp/jvm-consumer/SmokeTest.java <<'EOF'
          import dev.polylib.Polylib;
          import dev.polylib.ScoreSummary;
          import java.util.List;

          public class SmokeTest {
              public static void main(String[] args) {
                  if (!Polylib.VERSION.equals(Polylib.INSTANCE.ffiVersion())) {
                      throw new AssertionError("Version mismatch");
                  }
                  String slug = Polylib.INSTANCE.normalizeSlug("Hello JDK Matrix!");
                  if (!"hello-jdk-matrix".equals(slug)) {
                      throw new AssertionError("Unexpected slug: " + slug);
                  }
                  ScoreSummary summary = Polylib.INSTANCE.summarizeScores(List.of(10.0, 20.0, 30.0));
                  if (summary.getCount() != 3L || summary.getMean() != 20.0) {
                      throw new AssertionError("Unexpected summary: " + summary);
                  }
              }
          }
          EOF
          javac -cp "$GITHUB_WORKSPACE/dist-kt/*" /tmp/jvm-consumer/SmokeTest.java
          java -cp "/tmp/jvm-consumer:$GITHUB_WORKSPACE/dist-kt/*" SmokeTest

  ruby-versions:
    name: Ruby Gem Compatibility (Ruby ${{ matrix.ruby-version }})
    needs: [changes, uniffi-kotlin-ruby]
    if: github.event_name != 'push' && needs.changes.outputs.ruby == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.2", "3.3", "3.4"]
    steps:
      - name: Setup Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: ${{ matrix.ruby-version }}

      - name: Download packed Ruby gem
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: polylib-rb-gem
          path: dist-rb

      - name: Install gem and verify Polylib FFI across Ruby ${{ matrix.ruby-version }}
        run: |
          gems=(dist-rb/*.gem)
          gem install --no-document ffi "${gems[0]}"
          ruby -e '
            require "polylib"
            raise "version" unless Polylib::VERSION.match?(/\A\d+\.\d+\.\d+/)
            raise "slug" unless Polylib.normalize_slug("Hello Ruby Matrix!") == "hello-ruby-matrix"
            s = Polylib.summarize_scores([10.0, 20.0, 30.0])
            raise "summary" unless s.count == 3 && s.mean == 20.0
          '

  swift-versions:
    name: Swift Compatibility (${{ matrix.label }})
    needs: [changes]
    if: github.event_name != 'push' && needs.changes.outputs.swift == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS-15 (Swift 6)
            os: macos-15
            setup_swift: false
            swift_version: ""
          - label: Linux (Swift 6.1)
            # Pinned to 24.04: `ubuntu-latest` now resolves to Ubuntu 26, which
            # swift-actions/setup-swift does not support yet.
            os: ubuntu-24.04
            setup_swift: true
            swift_version: "6.1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Swift ${{ matrix.swift_version }} on Linux
        if: ${{ matrix.setup_swift }}
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: ${{ matrix.swift_version }}

      - name: Setup Pixi rust environment & Rust cache
        uses: ./.github/actions/setup-rust
        with:
          environment: rust
          cache-key: ci-uniffi-swift-${{ matrix.os }}

      - name: Build Swift UniFFI bindings and run SwiftPM conformance tests with coverage (>= 90%)
        run: |
          pixi run -e rust tools run ffi build --target swift
          pixi run -e rust tools run ffi test --target swift --require-swift --coverage
          pixi run -e rust tools run ffi compat --target swift --require-toolchain

      - name: Upload Swift coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-swift-${{ matrix.os }}
          path: coverage/swift/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Swift coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/swift/lcov.info
          flags: swift
          name: coverage-swift-${{ matrix.os }}
          fail_ci_if_error: false

  cross-os:
    name: Cross-OS Polyglot Matrix (${{ matrix.os }})
    needs: [changes]
    if: >-
      github.event_name != 'push' && (
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.js == 'true' ||
      needs.changes.outputs.jvm == 'true' ||
      needs.changes.outputs.ruby == 'true' ||
      needs.changes.outputs.swift == 'true'
      )
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup full environment & build bindings
        uses: ./.github/actions/setup-bindings
        with:
          cache-key: ci-cross-os-${{ matrix.os }}

      - name: Run polyglot test suites
        uses: ./.github/actions/diagnose
        with:
          label: "cross-os polyglot tests"
          command: pixi run -e full tools run test

      - name: Run Rust compatibility suites
        uses: ./.github/actions/diagnose
        with:
          label: "cross-os rust compat"
          command: pixi run -e full tools run rust compat

      - name: Run Python compatibility suites
        uses: ./.github/actions/diagnose
        with:
          label: "cross-os python compat"
          command: pixi run -e full tools run python compat

      - name: Run TypeScript compatibility suites
        uses: ./.github/actions/diagnose
        with:
          label: "cross-os ts compat"
          command: pixi run -e full tools run ts compat

  ci-gate:
    name: CI Required Gate
    if: always()
    needs:
      - changes
      - quality
      - rust
      - rust-msrv
      - polyglot-bindings
      - python-versions
      - node-versions
      - node-musl
      - bun-versions
      - uniffi-kotlin-ruby
      - java-versions
      - ruby-versions
      - swift-versions
      - cross-os
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all CI jobs succeeded
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # A skipped job reports Success to branch protection, so the gate is
          # what distinguishes "nothing to do" from "something went wrong".
          #
          # `skipped` is legitimate in exactly two cases: a push to main, which
          # does not repeat the version matrices, and a job whose ecosystem the
          # change cannot reach. Both are decisions made by the workflow. A
          # `failure` or a `cancelled` job fails the gate, and so does a job
          # that reported no result at all.
          statuses="${{ join(needs.*.result, ',') }}"
          echo "Job results: $statuses"
          for s in $(echo "$statuses" | tr ',' ' '); do
            case "$s" in
              success)
                ;;
              skipped)
                ;;
              *)
                echo "CI gate failed: detected status '$s'"
                exit 1
                ;;
            esac
          done
