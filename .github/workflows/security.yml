name: Security

# Every audit below reads a different set of inputs, so the filtering lives on
# the jobs rather than on the workflow.
#
# A workflow-level `paths` filter cannot express that: one shared allowlist has
# to cover the union of every job's inputs, so the broadest job drags the
# others along. The previous list included `apps/**` and `tools/**`, which meant
# a pull request that only touched a single documentation `.tsx` file still ran
# all nine security jobs.
#
# Job-level `paths` filters are evaluated against the whole pull request diff,
# not only the latest push, and each job lists only what it actually reads.
#
# A job skipped by a path filter still reports its check as successful, so
# branch protection keeps seeing a status. That is why the workflow itself is
# never path-filtered: a workflow that does not start reports nothing at all,
# and a required check would block the pull request forever.
#
# `paths` is not evaluated for `schedule` or `workflow_dispatch`, so the weekly
# advisory sweep still runs every job against the whole repository.
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly automated advisory sweep (Mondays 05:00 UTC)
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-supply-chain:
    name: Rust Supply-Chain & Advisory Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".cargo/audit.toml"
      - "tools/security/**"
      - "tools/rust/**"
      - ".github/workflows/security.yml"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain & cache
        uses: ./.github/actions/setup-rust
        with:
          environment: rust
          cache-key: security-rust

      - name: Run online cargo-deny checks
        uses: ./.github/actions/diagnose
        with:
          label: "cargo-deny (online)"
          command: pixi run -e rust tools run security deny_rs --online

      - name: Run RustSec cargo-audit against Cargo.lock
        uses: ./.github/actions/diagnose
        with:
          label: "cargo-audit"
          command: pixi run -e rust tools run security audit_rs

  python-dependencies:
    name: Python Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    paths:
      - "packages/polylib-py/**"
      - "pyproject.toml"
      - "pixi.toml"
      - "pixi.lock"
      - "tools/security/**"
      - "tools/python/**"
      - ".github/workflows/security.yml"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pixi py environment
        uses: ./.github/actions/setup
        with:
          environment: py

      - name: Run pip-audit
        run: pixi run -e py tools run security audit_py

  js-dependencies:
    name: JavaScript / Bun Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    paths:
      - "packages/config/**"
      - "packages/polylib-js/**"
      - "packages/polylib-ts/**"
      - "packages/polylib-wasm/**"
      - "apps/docs/package.json"
      - "package.json"
      - "bun.lock"
      - "tools/security/**"
      - "tools/ts/**"
      - ".github/workflows/security.yml"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pixi js environment & Bun workspace
        uses: ./.github/actions/setup
        with:
          environment: js
          install-bun: "true"

      - name: Audit Bun workspace dependencies (high+ severity)
        run: pixi run -e js tools run security audit_js --level high

  secrets-scan:
    name: Secret Detection (TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Deliberately not path-filtered: a credential can be committed to any file,
    # so this scan has to see every change to stay meaningful.
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan commits for leaked credentials
        uses: trufflesecurity/trufflehog@3bd2b5887eb0efb8fa18bfd1d296032924e4ffdc # v3.99.9
        with:
          # Avoid false positives on synthetic local example URLs or test tokens.
          extra_args: --results=verified

  codeql-rust:
    name: CodeQL Static Analysis (rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/security.yml"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: rust

      - name: Autobuild compiled targets
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:rust"

  codeql-python:
    name: CodeQL Static Analysis (python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    paths:
      - "packages/polylib-py/**"
      - "tools/**"
      - "pyproject.toml"
      - "pixi.toml"
      - ".github/workflows/security.yml"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python

      - name: Autobuild compiled targets
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:python"

  codeql-javascript-typescript:
    name: CodeQL Static Analysis (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    paths:
      - "packages/polylib-js/**"
      - "packages/polylib-ts/**"
      - "packages/polylib-wasm/**"
      - "packages/config/**"
      - "apps/docs/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/security.yml"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript

      - name: Autobuild compiled targets
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:javascript-typescript"

  codeql-actions:
    name: CodeQL Static Analysis (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/workflows/security.yml"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: actions

      - name: Autobuild compiled targets
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:actions"

  scorecard:
    name: OpenSSF Scorecard
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
      checks: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false

      - name: Upload Scorecard SARIF report
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard.sarif

  security-gate:
    name: Security Required Gate
    if: always()
    needs:
      - rust-supply-chain
      - python-dependencies
      - js-dependencies
      - secrets-scan
      - codeql-rust
      - codeql-python
      - codeql-javascript-typescript
      - codeql-actions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every security job that ran succeeded
        env:
          # A job skipped by its own path filter still reports a successful
          # check, so `skipped` is not a failure here. A real failure or a
          # cancellation is, and must fail the gate.
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Job results: $RESULTS"
          for s in $(echo "$RESULTS" | tr ',' ' '); do
            case "$s" in
              success|skipped)
                ;;
              *)
                echo "Security gate failed: detected status '$s'"
                exit 1
                ;;
            esac
          done
