name: Security

# The audits read the dependency manifests and the source, so a change that
# touches none of them cannot change their result. The paths below keep a
# documentation-only pull request from spending a runner on an audit that would
# produce the same output. The weekly schedule covers the repository as a whole
# regardless of what changed.
on:
  push:
    branches:
      - main
    paths:
      - "crates/**"
      - "packages/**"
      - "apps/**"
      - "tools/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "bun.lock"
      - "pyproject.toml"
      - "pixi.toml"
      - "pixi.lock"
      - "deny.toml"
      - ".cargo/audit.toml"
      - ".github/workflows/security.yml"
  pull_request:
    paths:
      - "crates/**"
      - "packages/**"
      - "apps/**"
      - "tools/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "bun.lock"
      - "pyproject.toml"
      - "pixi.toml"
      - "pixi.lock"
      - "deny.toml"
      - ".cargo/audit.toml"
      - ".github/workflows/security.yml"
  schedule:
    # Weekly automated advisory sweep (Mondays 05:00 UTC)
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-supply-chain:
    name: Rust Supply-Chain & Advisory Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain & cache
        uses: ./.github/actions/setup-rust
        with:
          environment: rust
          cache-key: security-rust

      - name: Run online cargo-deny checks
        uses: ./.github/actions/diagnose
        with:
          label: "cargo-deny (online)"
          command: pixi run -e rust tools run security deny_rs --online

      - name: Run RustSec cargo-audit against Cargo.lock
        uses: ./.github/actions/diagnose
        with:
          label: "cargo-audit"
          command: pixi run -e rust tools run security audit_rs

  python-dependencies:
    name: Python Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pixi py environment
        uses: ./.github/actions/setup
        with:
          environment: py

      - name: Run pip-audit
        run: pixi run -e py tools run security audit_py

  js-dependencies:
    name: JavaScript / Bun Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pixi js environment & Bun workspace
        uses: ./.github/actions/setup
        with:
          environment: js
          install-bun: "true"

      - name: Audit Bun workspace dependencies (high+ severity)
        run: pixi run -e js tools run security audit_js --level high

  secrets-scan:
    name: Secret Detection (TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan commits for leaked credentials
        uses: trufflesecurity/trufflehog@3bd2b5887eb0efb8fa18bfd1d296032924e4ffdc # v3.99.9
        with:
          # Avoid false positives on synthetic local example URLs or test tokens.
          extra_args: --results=verified

  codeql:
    name: CodeQL Static Analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - rust
          - python
          - javascript-typescript
          - actions
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild compiled targets
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"

  scorecard:
    name: OpenSSF Scorecard
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
      checks: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false

      - name: Upload Scorecard SARIF report
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard.sarif
