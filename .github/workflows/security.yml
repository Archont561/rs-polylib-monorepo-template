name: Security

# Every pull request starts this workflow so each job can report a status, then
# the `changes` job decides which audits the change can actually affect. A
# documentation-only pull request therefore reaches only the secret scan.
#
# A workflow-level `paths` filter would stop the workflow from starting at all,
# but GitHub leaves the checks of a non-started workflow pending instead of
# skipped, which blocks the merge it was meant to speed up. The weekly schedule
# and a manual dispatch audit the whole repository regardless of what changed.
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly automated advisory sweep (Mondays 05:00 UTC)
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GitHub applies `paths` to the workflow as a whole and offers no per-job
  # equivalent, so this job answers the question once and the audits read the
  # answer. A skipped job still reports a status, which a workflow-level filter
  # does not: a required check must never sit pending.
  #
  # A scheduled or manual run audits everything, so the outputs are all `true`
  # and no audit can be skipped by an empty or unrelated diff.
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      python: ${{ steps.detect.outputs.python }}
      js: ${{ steps.detect.outputs.js }}
      codeql-rust: ${{ steps.detect.outputs.codeql-rust }}
      codeql-python: ${{ steps.detect.outputs.codeql-python }}
      codeql-javascript-typescript: ${{ steps.detect.outputs.codeql-javascript-typescript }}
      codeql-actions: ${{ steps.detect.outputs.codeql-actions }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Compare the change against the filters
        id: detect
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # A scheduled or manual run is a whole-repository audit, so every
          # filter is forced on rather than derived from an empty diff.
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Whole-repository run: enabling every audit."
            for key in rust python js codeql-rust codeql-python \
                       codeql-javascript-typescript codeql-actions; do
              echo "$key=true" >> "$GITHUB_OUTPUT"
            done
          else
            python3 .github/scripts/detect_changes.py --profile security
          fi

  rust-supply-chain:
    name: Rust Supply-Chain & Advisory Audit
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain & cache
        uses: ./.github/actions/setup-rust
        with:
          environment: rust
          cache-key: security-rust

      - name: Run online cargo-deny checks
        uses: ./.github/actions/diagnose
        with:
          label: "cargo-deny (online)"
          command: pixi run -e rust tools run security deny_rs --online

      - name: Run RustSec cargo-audit against Cargo.lock
        uses: ./.github/actions/diagnose
        with:
          label: "cargo-audit"
          command: pixi run -e rust tools run security audit_rs

  python-dependencies:
    name: Python Dependency Vulnerability Audit
    needs: [changes]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pixi py environment
        uses: ./.github/actions/setup
        with:
          environment: py

      - name: Run pip-audit
        run: pixi run -e py tools run security audit_py

  js-dependencies:
    name: JavaScript / Bun Dependency Audit
    needs: [changes]
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pixi js environment & Bun workspace
        uses: ./.github/actions/setup
        with:
          environment: js
          install-bun: "true"

      - name: Audit Bun workspace dependencies (high+ severity)
        run: pixi run -e js tools run security audit_js --level high

  secrets-scan:
    name: Secret Detection (TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan commits for leaked credentials
        uses: trufflesecurity/trufflehog@3bd2b5887eb0efb8fa18bfd1d296032924e4ffdc # v3.99.9
        with:
          # Avoid false positives on synthetic local example URLs or test tokens.
          extra_args: --results=verified

  codeql-rust:
    name: CodeQL Static Analysis (rust)
    needs: [changes]
    if: needs.changes.outputs.codeql-rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: rust

      - name: Autobuild compiled targets
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:rust"

  codeql-python:
    name: CodeQL Static Analysis (python)
    needs: [changes]
    if: needs.changes.outputs.codeql-python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python

      - name: Autobuild compiled targets
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:python"

  codeql-javascript-typescript:
    name: CodeQL Static Analysis (javascript-typescript)
    needs: [changes]
    if: needs.changes.outputs.codeql-javascript-typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript

      - name: Autobuild compiled targets
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:javascript-typescript"

  codeql-actions:
    name: CodeQL Static Analysis (actions)
    needs: [changes]
    if: needs.changes.outputs.codeql-actions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: actions

      - name: Autobuild compiled targets
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:actions"

  scorecard:
    name: OpenSSF Scorecard
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
      checks: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false

      - name: Upload Scorecard SARIF report
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard.sarif

  # The audits report `skipped` when a change cannot reach them, and branch
  # protection reads a skipped job as Success. This job is what distinguishes a
  # justified skip from an audit that silently did not run.
  security-gate:
    name: Security Required Gate
    if: always()
    needs:
      - changes
      - rust-supply-chain
      - python-dependencies
      - js-dependencies
      - secrets-scan
      - codeql-rust
      - codeql-python
      - codeql-javascript-typescript
      - codeql-actions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify no audit failed
        run: |
          statuses="${{ join(needs.*.result, ',') }}"
          echo "Job results: $statuses"
          for s in $(echo "$statuses" | tr ',' ' '); do
            case "$s" in
              success|skipped)
                ;;
              *)
                echo "Security gate failed: detected status '$s'"
                exit 1
                ;;
            esac
          done
