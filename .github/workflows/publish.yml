name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Verify and build without pushing to external registries or GitHub Releases"
        required: false
        type: boolean
        default: true
      publish_github_packages:
        description: "Publish npm, Maven, and RubyGems mirrors to GitHub Packages"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Artifacts & Report
    uses: ./.github/workflows/build.yml

  publish-crates:
    name: Publish to crates.io (Trusted Publishing OIDC)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          environment: rust
          cache-key: publish-crates

      - name: Exchange GitHub OIDC token for short-lived crates.io publish token
        if: ${{ inputs.dry_run != true }}
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish polylib-core then polylib in topological order
        env:
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run enabled: running cargo publish --dry-run."
            pixi run -e rust cargo publish --dry-run --locked -p polylib-core
            exit 0
          fi
          pixi run -e rust cargo publish --locked -p polylib-core
          sleep 20
          pixi run -e rust cargo publish --locked -p polylib

  publish-pypi:
    name: Publish to PyPI (Trusted Publishing OIDC)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release-bundle artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: release-bundle

      - name: Stage Python wheels and sdist
        run: |
          mkdir -p dist-pypi
          find release-bundle -type f \( -name '*.whl' -o -name 'polylib-*.tar.gz' \) ! -name 'polylib-swift-*' -exec cp {} dist-pypi/ \;
          ls -la dist-pypi

      - name: Publish to PyPI via Trusted Publishing (OIDC)
        if: ${{ inputs.dry_run != true }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist-pypi
          skip-existing: true
          attestations: true

  publish-npm:
    name: Publish to npmjs.com (Trusted Publishing OIDC + Provenance)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node.js 24 for npm OIDC Trusted Publishing
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm CLI to latest OIDC-capable release
        run: npm install --global npm@latest

      - name: Download release-bundle artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: release-bundle

      - name: Publish npm tarballs in topological order via OIDC (no NPM_TOKEN)
        env:
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          # Order matters. `@polylib/polylib-js` declares its eight platform
          # packages as exact-version optional dependencies, so they must exist
          # before it does. `@polylib/polylib` peers on the WebAssembly package,
          # so that goes next, and the facade last. A missing platform package
          # fails the release rather than being skipped.
          npm_dir=release-bundle/artifacts-npm
          platforms=()
          for tarball in "$npm_dir"/polylib-polylib-js-*-*-*.tgz; do
            [ -e "$tarball" ] || continue
            platforms+=("$tarball")
          done
          expected=$(jq -r 'length' "$npm_dir/napi-platforms.json" 2>/dev/null || echo 0)
          echo "Publishing ${#platforms[@]} platform package(s); the release lists ${expected}."
          if [ "${#platforms[@]}" -ne "${expected}" ]; then
            echo "The release lists ${expected} platform packages but only ${#platforms[@]} were packed."
            exit 1
          fi
          flags=(--access public --provenance)
          if [ "$DRY_RUN" = "true" ]; then
            flags+=(--dry-run)
          fi
          for tarball in "${platforms[@]}"; do
            echo "publishing $tarball"
            npm publish "${flags[@]}" "$tarball"
          done
          wasm_tgz=(release-bundle/artifacts-npm/polylib-polylib-wasm-*.tgz)
          js_tgz=(release-bundle/artifacts-npm/polylib-polylib-js-[0-9]*.tgz)
          ts_tgz=(release-bundle/artifacts-npm/polylib-polylib-[0-9]*.tgz)
          npm publish "${flags[@]}" "${wasm_tgz[0]}"
          npm publish "${flags[@]}" "${js_tgz[0]}"
          npm publish "${flags[@]}" "${ts_tgz[0]}"

  publish-rubygems:
    name: Publish to RubyGems.org (Trusted Publishing OIDC)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: rubygems
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pixi rb environment
        uses: ./.github/actions/setup
        with:
          environment: rb

      - name: Download release-bundle artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: release-bundle

      - name: Exchange GitHub OIDC token for short-lived RubyGems credentials
        if: ${{ inputs.dry_run != true }}
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Push Ruby gem to RubyGems.org
        env:
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
        run: |
          gems=(release-bundle/artifacts-ruby/*.gem)
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run enabled: inspecting ${gems[0]}"
            pixi run -e rb gem specification "${gems[0]}" --ruby >/dev/null
            exit 0
          fi
          pixi run -e rb gem push "${gems[0]}"

  publish-maven-central:
    name: Publish Kotlin JAR to Maven Central
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: maven-central
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pixi kt environment
        uses: ./.github/actions/setup-rust
        with:
          environment: kt
          cache-key: publish-maven-central

      - name: Build Kotlin bindings and publish to Maven Central when configured
        env:
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
          MAVEN_CENTRAL_URL: ${{ vars.MAVEN_CENTRAL_URL }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          pixi run -e kt tools run ffi build --target kotlin
          if [ "$DRY_RUN" = "true" ] || [ -z "$MAVEN_CENTRAL_URL" ] || [ -z "$MAVEN_CENTRAL_USERNAME" ]; then
            echo "Maven Central dry-run or credentials not configured; validating Maven publication POM locally."
            (cd packages/polylib-kt && pixi run -e kt gradle generatePomFileForMavenPublication --no-daemon)
            exit 0
          fi
          (cd packages/polylib-kt && pixi run -e kt gradle publishAllPublicationsToMavenCentralRepository --no-daemon)

  publish-github-packages-npm:
    name: Publish npm Packages to GitHub Packages
    if: ${{ inputs.publish_github_packages != false }}
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: github-packages-npm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pixi default environment
        uses: ./.github/actions/setup
        with:
          environment: default

      - name: Setup Node.js for GitHub Packages npm registry
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"

      - name: Download release-bundle artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: release-bundle

      - name: Re-scope tarballs to GitHub owner and publish to GitHub Packages npm
        env:
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
          GH_OWNER: ${{ github.repository_owner }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pixi run tools run release repack_gh_npm \
            --owner "$GH_OWNER" \
            --input-dir release-bundle/artifacts-npm \
            --output-dir dist-gh-npm
          # Same ordering as npmjs: the platform packages a package depends on
          # must exist before the package that names them.
          platforms=(dist-gh-npm/*-polylib-js-*-*-*.tgz)
          flags=(--registry https://npm.pkg.github.com)
          if [ "$DRY_RUN" = "true" ]; then
            flags+=(--dry-run)
          fi
          for tarball in "${platforms[@]}"; do
            [ -e "$tarball" ] || continue
            npm publish "${flags[@]}" "$tarball"
          done
          wasm_tgz=(dist-gh-npm/*-polylib-wasm-*.tgz)
          js_tgz=(dist-gh-npm/*-polylib-js-[0-9]*.tgz)
          ts_tgz=(dist-gh-npm/*-polylib-[0-9]*.tgz)
          npm publish "${flags[@]}" "${wasm_tgz[0]}"
          npm publish "${flags[@]}" "${js_tgz[0]}"
          npm publish "${flags[@]}" "${ts_tgz[0]}"

  publish-github-packages-maven:
    name: Publish Kotlin JAR to GitHub Packages Maven
    if: ${{ inputs.publish_github_packages != false }}
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: github-packages-maven
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pixi kt environment
        uses: ./.github/actions/setup-rust
        with:
          environment: kt
          cache-key: publish-gh-maven

      - name: Build Kotlin JAR and publish to GitHub Packages Maven
        env:
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pixi run -e kt tools run ffi build --target kotlin
          if [ "$DRY_RUN" = "true" ]; then
            (cd packages/polylib-kt && pixi run -e kt gradle generatePomFileForMavenPublication jar --no-daemon)
            exit 0
          fi
          (cd packages/polylib-kt && pixi run -e kt gradle publishAllPublicationsToGitHubPackagesRepository --no-daemon)

  publish-github-packages-rubygems:
    name: Publish Ruby Gem to GitHub Packages RubyGems
    if: ${{ inputs.publish_github_packages != false }}
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: github-packages-rubygems
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pixi rb environment
        uses: ./.github/actions/setup
        with:
          environment: rb

      - name: Download release-bundle artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: release-bundle

      - name: Push Ruby gem to GitHub Packages RubyGems
        env:
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
          GH_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gems=(release-bundle/artifacts-ruby/*.gem)
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run enabled: skipping GitHub Packages RubyGems push for ${gems[0]}"
            exit 0
          fi
          mkdir -p "$HOME/.gem"
          printf -- "---\n:github: Bearer %s\n" "$GITHUB_TOKEN" > "$HOME/.gem/credentials"
          chmod 0600 "$HOME/.gem/credentials"
          pixi run -e rb gem push --key github --host "https://rubygems.pkg.github.com/${GH_OWNER}" "${gems[0]}"

  github-release:
    name: Create GitHub Release with Changelog & All Artifacts
    if: ${{ startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true }}
    needs:
      - build
      - publish-crates
      - publish-pypi
      - publish-npm
      - publish-rubygems
      - publish-maven-central
      - publish-github-packages-npm
      - publish-github-packages-maven
      - publish-github-packages-rubygems
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: github-release
    permissions:
      contents: write
    steps:
      - name: Checkout repository with full history for changelog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Pixi lint environment (convco + tasknest)
        uses: ./.github/actions/setup
        with:
          environment: lint

      - name: Download unified release-bundle artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: release-bundle

      - name: Generate conventional changelog + build report release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Release notes are the user-facing record of the release, so a
          # convco that cannot run is a release blocker rather than a reason to
          # quietly fall back to a raw `git log`. `convco` lives in the lint
          # environment, not on the bare runner PATH.
          pixi run -e lint convco --version
          pixi run -e lint tools run release changelog \
            --output RELEASE_NOTES.md \
            --tag "$RELEASE_TAG" \
            --report-md release-bundle/report.md
          grep -q '^## ' RELEASE_NOTES.md
          cat RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release with changelog and all artifacts
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          files: |
            release-bundle/**/*.crate
            release-bundle/**/*.whl
            release-bundle/**/*.tar.gz
            release-bundle/**/*.tgz
            release-bundle/**/*.jar
            release-bundle/**/*.pom
            release-bundle/**/*.gem
            release-bundle/report.json
            release-bundle/report.md
            release-bundle/SHA256SUMS.txt
